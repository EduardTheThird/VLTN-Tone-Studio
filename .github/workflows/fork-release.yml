# Fork release (EduardTheThird/VLTN-Tone-Studio only): builds unsigned macOS and Windows installers from main and
# publishes them as GitHub Release v<version>, where <version> comes from app/package.json. Installed apps look for
# updates in this repository (app/electron-builder.yml › publish, app/src/shared/host/update.ts).
# To cut a release: bump "version" in app/package.json, add its "## [<version>]" section to CHANGELOG.md, merge to main,
# then Actions › Fork release › Run workflow, or `gh workflow run fork-release.yml -R EduardTheThird/VLTN-Tone-Studio`.
# The release is a draft until every file is uploaded, then it is published as the latest release.
name: Fork release

on:
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Node 24, as on the development Mac: under Node 26 its built-in localStorage hides the test one and library tests fail.
  NODE_VERSION: "24"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./app/package.json').version")"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump \"version\" in app/package.json, then run the workflow again."
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [$version]\" section. Add it, then run the workflow again."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:toolkit

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx electron-vite build
        env:
          # Optional repository secret; without it the TONE3000 sign-in reports a missing app key.
          MAIN_VITE_T3K_CLIENT_ID: ${{ secrets.T3K_CLIENT_ID }}
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No Developer ID / Authenticode certificate yet: build unsigned instead of searching the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          # latest*.yml and the blockmaps are the in-app update feed (electron-builder.yml › publish).
          path: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.blockmap
            app/dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/release-notes.md
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l packages
          # The app updates itself from this feed; a release without it would leave Windows users behind.
          test -s packages/latest.yml || { echo "::error::latest.yml is missing, the in-app updater couldn't find this release"; exit 1; }
          grep -qx "version: ${TAG#v}" packages/latest.yml || { echo "::error::latest.yml doesn't describe ${TAG#v}"; exit 1; }
          # This version's CHANGELOG section (up to the next "## " heading or the link list), then the install notes.
          awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { on = 1; next } on && (/^## / || /^\[[^]]+\]: /) { exit } on' CHANGELOG.md > notes.md
          printf '\n' >> notes.md
          cat .github/release-notes.md >> notes.md
          # Draft first, published once every file is uploaded: the updater never sees a release without its feed.
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VLTN Tone Studio $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
