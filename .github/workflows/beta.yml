# Beta build (this fork only): builds unsigned macOS and Windows installers from a branch and attaches them to the
# workflow run as downloads. Nothing is published, and the version is set only inside the packages, so the branch
# stays as it is. Start it from Actions › Beta build › Run workflow, or `gh workflow run beta.yml -f version=0.9.0-beta.2`.
name: Beta build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: features/gp180-bluetooth-performance-playlists
        required: true
      version:
        description: Version the installed app reports (keep it above the upstream release, e.g. 0.9.0-beta.1)
        default: 0.9.0-beta.1
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:toolkit

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            name: mac
          - os: windows-latest
            target: --win
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx electron-vite build
        env:
          MAIN_VITE_T3K_CLIENT_ID: ${{ secrets.T3K_CLIENT_ID }}
      - run: npx electron-builder ${{ matrix.target }} --publish never "-c.extraMetadata.version=$VERSION"
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          # No signing certificate: build unsigned instead of searching the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: vltn-tone-studio-${{ inputs.version }}-${{ matrix.name }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
          if-no-files-found: error
          retention-days: 30
